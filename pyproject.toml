[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-vision-inspector"
version = "1.0.0"
description = "Visual inspection by point of interest with multimodal models, local (Ollama) or cloud, configured in YAML"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ander Sein Otegui", email = "aseinotegi@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "paho-mqtt>=2.0",
]
keywords = ["vision-language-model", "ollama", "gemini", "inspection", "robotics", "iiot", "mqtt"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
poi-inspect = "poi_inspector.cli:main"

[project.urls]
Homepage = "https://andersein.com"
Source = "https://github.com/aseinotegi/poi-vision-inspector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
